<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Plan Your Trip - Smart Travel</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <header>

        <div class="logo">
            SMART TRAVEL
        </div>

        <nav>

            <a href="/">
                HOME
            </a>

            <a href="/explore">
                EXPLORE
            </a>

            <a href="/plan">
                PLAN TRIP
            </a>

        </nav>

    </header>


    <section class="plan-section">

        <div class="plan-box">

            <p class="small-title">
                PLAN YOUR JOURNEY
            </p>

            <h1>
                Where do you want to go?
            </h1>

            <p class="description">
                Enter your starting city and choose a destination.
            </p>


            <form action="/calculate" method="POST">

                <label>
                    Starting City
                </label>

                <input
                    type="text"
                    name="start_city"
                    placeholder="Example: Thrissur"
                    required
                >


<label>
    Destination
</label>

<select name="destination" required>

    <option value="" {% if not selected_destination %}selected{% endif %}>
        Select destination
    </option>

    <option value="Kochi" {% if selected_destination == "Kochi" %}selected{% endif %}>Kochi</option>
    <option value="Munnar" {% if selected_destination == "Munnar" %}selected{% endif %}>Munnar</option>
    <option value="Wayanad" {% if selected_destination == "Wayanad" %}selected{% endif %}>Wayanad</option>
    <option value="Ooty" {% if selected_destination == "Ooty" %}selected{% endif %}>Ooty</option>
    <option value="Panaji" {% if selected_destination == "Panaji" %}selected{% endif %}>Panaji</option>
    <option value="Jaipur" {% if selected_destination == "Jaipur" %}selected{% endif %}>Jaipur</option>
    <option value="Delhi" {% if selected_destination == "Delhi" %}selected{% endif %}>Delhi</option>
    <option value="Mumbai" {% if selected_destination == "Mumbai" %}selected{% endif %}>Mumbai</option>
    <option value="Bengaluru" {% if selected_destination == "Bengaluru" %}selected{% endif %}>Bengaluru</option>
    <option value="Hyderabad" {% if selected_destination == "Hyderabad" %}selected{% endif %}>Hyderabad</option>
    <option value="Chennai" {% if selected_destination == "Chennai" %}selected{% endif %}>Chennai</option>
    <option value="Trivandrum" {% if selected_destination == "Trivandrum" %}selected{% endif %}>Trivandrum</option>
    <option value="Mysore" {% if selected_destination == "Mysore" %}selected{% endif %}>Mysore</option>
    <option value="Agra" {% if selected_destination == "Agra" %}selected{% endif %}>Agra</option>
    <option value="Shimla" {% if selected_destination == "Shimla" %}selected{% endif %}>Shimla</option>
    <option value="Manali" {% if selected_destination == "Manali" %}selected{% endif %}>Manali</option>
    <option value="Rishikesh" {% if selected_destination == "Rishikesh" %}selected{% endif %}>Rishikesh</option>
    <option value="Darjeeling" {% if selected_destination == "Darjeeling" %}selected{% endif %}>Darjeeling</option>
    <option value="Amritsar" {% if selected_destination == "Amritsar" %}selected{% endif %}>Amritsar</option>
    <option value="Pondicherry" {% if selected_destination == "Pondicherry" %}selected{% endif %}>Pondicherry</option>

</select>

<label>
    Number of Travelers
</label>

<input
    type="number"
    name="travelers"
    value="1"
    min="1"
    required
>
                <label>
    One-way Sleeper Class Train Fare (₹ per person)
</label>

<input
    type="number"
    name="train_fare"
    placeholder="Enter train fare"
    min="0"
    step="0.01"
    required
>


                <label>
                    Number of Days
                </label>

                <input
                    type="number"
                    name="days"
                    value="1"
                    min="1"
                    required
                >


                <button type="submit">
                    CALCULATE TRIP →
                </button>

            </form>

        </div>

    </section>


</body>

</html>
